# idf-monitor keys for tools/monitor.sh, read through ESP_IDF_MONITOR_CFGFILE.
#
# Ctrl-C quits, like every other command in the terminal. idf-monitor's default is
# Ctrl-] and Ctrl-C goes to the board instead — which our firmware has no use for, as
# it has no console reading stdin. The monitor puts the terminal in raw mode, so Ctrl-C
# reaches it as the character 0x03, not as SIGINT, and the only way to make it quit is
# to name C as the exit key. Ctrl-] still works from the menu: Ctrl-T Ctrl-X.
[esp-idf-monitor]
exit_key = C
